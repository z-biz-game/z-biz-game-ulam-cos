name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 拷哪些不写在这里——写在 tools/assemble-site.sh，本地闸与 CI 调同一支脚本。
      # 以前这里是手抄的三行 cp（index.html/css/js），于是页面后来引用的
      # manifest.webmanifest、sw.js、icons/* 全都上不了线：线上 404，而 CI 一路绿，
      # 因为没有任何一步加载过那份产物。服务器、台架、文档、node_modules 仍在 artifact 外面。
      - name: Assemble static site
        run: bash tools/assemble-site.sh _site
      - name: Deploy set gate (checks the very _site about to be uploaded)
        run: node tools/deploy-set.mjs _site
      - name: The artifact is self-contained
        # 这三类断言以前是手抄在这里的七行 shell，而本仓的任何一道本地闸都不跑它们——于是它们
        # 连续红了三次推送没人知道：build 一红就没有 artifact，deploy 无事可做，线上冻在最后
        # 一次成功的那份产物上，后面的 commit 只存在于 git 里。逻辑搬进 tools/site-selfcontained.mjs，
        # 本地整闸与 CI 调同一支；它能咬人由 --selftest 的六刀当场证明（ci.yml 里那一跑）。
        run: node tools/site-selfcontained.mjs _site
      # The artifact has a fixed name (`github-pages`) that deploy-pages@v4 looks up by name in
      # this same run — assemble-and-stop leaves the deploy job with 0 artifacts to find.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
